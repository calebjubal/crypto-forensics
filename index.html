<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; worker-src 'none'">
  <title>Satoshi Trace · Offline Bitcoin Forensics</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./renderer.js" defer></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#overview" aria-label="Satoshi Trace overview"><img class="brand-mark" src="./assets/icon.png" alt=""><span>SATOSHI<span class="brand-sub">T R A C E</span></span></a>
    <div class="nav-label">INVESTIGATE</div>
    <nav id="navigation" aria-label="Main navigation"></nav>
  </aside>
  <div class="shell">
    <header class="topbar"><div class="breadcrumb"><strong id="breadcrumb">Overview</strong></div><div class="top-actions"><span class="offline-pill"><i></i> Offline</span></div></header>
    <main id="main" tabindex="-1"><div class="loading">Opening local evidence store…</div></main>
    <footer><span><i class="status-dot"></i> Local SQLite · No network transport</span><span>Investigative hypotheses. Human review required.</span></footer>
  </div>
  <section id="job" class="job-banner" hidden aria-live="polite"><div><strong id="job-phase">Processing</strong><span id="job-description"></span></div><progress id="job-progress" max="100" value="0"></progress><button class="button button-small" id="cancel-job">Cancel</button></section>
  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="detail-dialog"><div class="dialog-top"><span class="eyebrow" id="dialog-label">EVIDENCE DETAIL</span><button class="icon-button" id="close-dialog" aria-label="Close detail">✕</button></div><div id="dialog-body"></div></dialog>
</body>
</html>
